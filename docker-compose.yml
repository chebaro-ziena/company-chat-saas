
services:
  postgres:
    image: postgres:16-alpine
    container_name: company-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: company_chat
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - company_chat_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d company_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  company_chat_data:
